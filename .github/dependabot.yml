# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      mosaik:
        patterns: ['@pixel-brewery/mosaik-*', '@pixel-brewery/markdowner-*']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']
      nx:
        patterns: ['nx', '@nx/*']
      testing:
        patterns: ['vitest', '@vitest/*', 'playwright', '@playwright/*']
      capacitor:
        patterns: ['@capacitor/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions-updates:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /libs/remote-capacitor/android
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      ktor:
        patterns: ['io.ktor:*']
      camera:
        patterns: ['androidx.camera:*']
  - package-ecosystem: swift
    directory: /libs/remote-capacitor
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      nio:
        patterns: ['swift-nio*', 'swift-atomics', 'swift-collections', 'swift-system']
