name: Release packages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current protected main commit with successful Verify, Android and iOS
        required: true
        type: string
      family_version:
        description: Stable version already committed in all nine packages
        required: true
        type: string
      publish:
        description: Explicit owner approval to create the source tag and publish these exact artifacts
        required: true
        default: false
        type: boolean
      candidate_artifact_id:
        description: Optional original GitHub artifact ID to resume without preparing or rebuilding
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: remote-sdk-manual-release
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  FAMILY_VERSION: ${{ inputs.family_version }}

jobs:
  preflight:
    if: >-
      ${{ github.repository_id == '1472760702' && github.repository == 'pixel-brewery/remote' &&
          github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prove current source, original Verify and any retained producer
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set --
          if [ -n "$ARTIFACT_ID" ]; then set -- --artifactId "$ARTIFACT_ID"; fi
          yarn nx run nx-tasks:packages:release:preflight --sourceSha "$SOURCE_SHA" --familyVersion "$FAMILY_VERSION" "$@"

  prepare:
    needs: preflight
    if: inputs.candidate_artifact_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare and isolate-test the single exact tar family
        env:
          GH_TOKEN: ${{ github.token }}
        run: yarn nx run nx-tasks:packages:release:prepare --sourceSha "$SOURCE_SHA" --familyVersion "$FAMILY_VERSION" --artifactDirectory "${{ runner.temp }}/remote-sdk-candidate"
      - name: Retain the already verified bytes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-sdk-${{ inputs.family_version }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/remote-sdk-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [preflight, prepare]
    if: >-
      ${{ always() && inputs.publish && needs.preflight.result == 'success' &&
          (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      ARTIFACT_ID: ${{ inputs.candidate_artifact_id || needs.prepare.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify immutable artifact provenance before download
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: yarn nx run nx-tasks:packages:release:preflight --sourceSha "$SOURCE_SHA" --familyVersion "$FAMILY_VERSION" --artifactId "$ARTIFACT_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: pixel-brewery/remote
          run-id: ${{ steps.artifact.outputs.artifact_run_id }}
          path: ${{ runner.temp }}/remote-sdk-candidate
          merge-multiple: true
      - name: Tag the checked source and publish only missing identical versions
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn nx run nx-tasks:packages:release:publish --sourceSha "$SOURCE_SHA" --familyVersion "$FAMILY_VERSION" --artifactId "$ARTIFACT_ID" --artifactDirectory "${{ runner.temp }}/remote-sdk-candidate"
      - name: Verify all nine public versions, source associations and downloaded hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn nx run nx-tasks:packages:release:verify --sourceSha "$SOURCE_SHA" --familyVersion "$FAMILY_VERSION" --artifactId "$ARTIFACT_ID" --artifactDirectory "${{ runner.temp }}/remote-sdk-candidate"
